#!/usr/bin/nft -f
# CLIOS · firewall. Nada entra sem ser pedido; tudo o que você abre sai normalmente.
#
# Só mexe na própria tabela (`inet clios`), então Docker, libvirt e quem mais tiver regras não perdem as deles.
# Quer um servidor, SSH por exemplo? Acrescente `tcp dport 22 accept` na cadeia `input` e rode
# `sudo systemctl reload nftables`. Encaminhamento (forward) não é tocado: o Docker cuida do dele.

table inet clios
delete table inet clios

table inet clios {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif "lo" accept

    # ping e os avisos que o IPv6 exige para funcionar
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
    ip6 nexthdr icmpv6 accept

    # DHCP, para a rede subir
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
  }
}
