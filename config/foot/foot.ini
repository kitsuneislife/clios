# CLIOS · foot
# O foot roda como servidor (`foot --server`, iniciado pelo Hyprland) e cada janela é um
# `footclient`: abrir um terminal leva milissegundos e quase não gasta memória.
# Cores: colors.ini, gerado por `clios theme apply`.

include=~/.config/foot/colors.ini

[main]
font=GeistMono Nerd Font:size=11
pad=14x10
term=foot
bold-text-in-bright=no
# O que você seleciona com o mouse vai direto para a área de transferência (e para o histórico do SUPER + V).
selection-target=both

[scrollback]
lines=20000

[cursor]
style=block
blink=yes
blink-rate=530

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
