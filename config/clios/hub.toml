# Catálogo do CLIOS: os apps de terminal curados, como abrir, como instalar.
#
# O hub (`SUPER + espaço`) lista o que está instalado; com `+` ele mostra o que falta e instala
# com um Enter. O `clios apps` e o guia de boas-vindas leem este mesmo arquivo.
# Para ter o seu: copie para ~/.config/clios/hub.toml e edite.
#
#   id        nome curto, usado em `clios open <id>` e nos atalhos do Hyprland
#   job       o trabalho que o app faz, em uma palavra-chave. Dois apps não podem ter o mesmo `job`:
#             se um segundo faz a mesma coisa, ou ele é melhor e substitui o primeiro, ou não entra
#   name      como aparece (minúsculas, em português)
#   cmd       o comando
#   pkg       pacote(s) do Arch ou do AUR (o `paru` resolve os dois), separados por espaço
#   bin       o executável que prova que está instalado (padrão: o primeiro item de cmd)
#   category  arquivos | codigo | sistema | rede | midia | ler | falar | produtividade | pacotes | diversao
#   desc      uma frase sobre o que o app faz, sem ponto final
#   tip       uma dica de uso (como sair, a tecla mais útil)
#   tier      core (vem instalado) | extra (instala sob demanda)
#   float     abre numa janela flutuante e centralizada
#   hold      espera um Enter antes de fechar (para comandos que só imprimem)
#   saver     (diversão) como rodar de proteção de tela e no `clios play`. Marcadores de cor, trocados pelo tema:
#             {color} nome ANSI mais perto do acento, {n} o número dele, {hex} e {hexdim} o acento em RRGGBB
#             (inteiro e recuado), {palette} a paleta do csakura que combina com ele
#
# Apps gráficos (.desktop) aparecem sozinhos; não precisa listar.

