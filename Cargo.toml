[workspace]
resolver = "3"
members = ["crates/clios-core", "crates/clios"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kitsuneislife/clios"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "debug"] }
nucleo-matcher = "0.3"
png = { version = "0.18", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
